<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="panel">
    <div class="panel-search">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="rgba(235,235,245,0.55)" stroke-width="1.8" stroke-linecap="round"><circle cx="7.5" cy="7.5" r="5.5"></circle><path d="M11.6 11.6L16 16"></path></svg>
      <input type="text" id="filter-box" placeholder="Search transcriptions" autofocus>
      <span class="panel-count" id="count"></span>
    </div>
    <div id="entries"></div>
    <div class="panel-footer">
      <span class="hint"><span class="kbd">↵</span>Copy polished</span>
      <span class="hint"><span class="kbd">⌥↵</span>Copy original</span>
      <span class="hint"><span class="kbd">↑↓</span>Move</span>
      <span class="spacer"></span>
      <span class="hint"><span class="kbd">esc</span>Close</span>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
