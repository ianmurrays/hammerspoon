<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="panel">
    <div class="vocab-header">Dictation vocabulary <span class="vocab-sub">one term per line</span></div>
    <textarea id="terms" spellcheck="false" placeholder="DigitalOcean&#10;Vultr&#10;Hammerspoon"></textarea>
    <div class="panel-footer">
      <span class="hint">Saved as you type</span>
      <span class="spacer"></span>
      <span class="hint"><span class="kbd">esc</span>Close</span>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
