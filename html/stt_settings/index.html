<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="panel">
    <div class="settings-header">Dictation settings</div>
    <div class="settings-body">
      <div class="settings-nav" id="nav"></div>
      <div class="settings-editor">
        <div class="settings-editor-head">
          <span id="hint"></span>
          <span class="spacer"></span>
          <button id="remove" class="settings-remove">Remove</button>
        </div>
        <textarea id="text" spellcheck="false"></textarea>
      </div>
    </div>
    <div class="panel-footer">
      <span class="hint">Saved as you type</span>
      <span class="spacer"></span>
      <span class="hint"><span class="kbd">esc</span>Close</span>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
